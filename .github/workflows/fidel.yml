name: Fidel
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  fidel:
    name: Fidel Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Fidel Validate
        uses: usefidel/fidel-action@v3
        with:
          fail-on-drift: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
